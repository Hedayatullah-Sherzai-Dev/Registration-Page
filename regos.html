<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registration Project</title>
    <link rel="stylesheet" href="regos.css">
</head>
<body>
    <main class="register-container">
        <form class="register-box">
            <h1>Create Account</h1>
            <p class="subtitle">Join us by creating your account</p>
 
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name" required>
 
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
 
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" minlength="8" required>
 
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Repeat your password" minlength="8" required>
 
            <label class="terms">
                <input type="checkbox" required>
                I agree to the terms and conditions
            </label>
 
            <button type="submit">Create Account</button>
 
            <p class="login-text">
               I already have an account? <a href="../login-page/index.html">Login</a>
            </p>
        </form>
    </main>
</body>
</html>
